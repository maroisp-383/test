<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Règlement 672-2017 - Outil prévention incendie</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #18212e;
      --muted: #5a6572;
      --accent: #1b65d6;
      --border: #d7dfeb;
      --ok: #1a7f37;
      --bad: #b42318;
    }
    body.dark {
      --bg: #0f1722;
      --card: #192231;
      --text: #f0f5ff;
      --muted: #b3c0d4;
      --accent: #70a5ff;
      --border: #334155;
      --ok: #47d16c;
      --bad: #ff6f6f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
    button, select, input, textarea {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: .55rem .8rem;
      background: var(--card);
      color: var(--text);
    }
    button { cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .container {
      margin: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: calc(100vh - 110px);
      overflow: auto;
      padding: 1rem;
    }
    .module { display: none; }
    .module.active { display: block; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 1100px; }
    th, td { border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; padding: .6rem; }
    th { position: sticky; top: 0; background: var(--card); z-index: 5; }
    .small { color: var(--muted); font-size: .9rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: 1.3fr .7fr; }
    .card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; background: var(--card); }
    .choices { display: grid; gap: .5rem; margin-top: .8rem; }
    .choice-btn { text-align: left; }
    .score { display: grid; gap: .5rem; }
    .score .v { font-size: 1.3rem; font-weight: 700; }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: .8rem; align-items: center; }
    textarea { width: 100%; min-height: 180px; }
    dialog { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; max-width: 520px; }
    dialog::backdrop { background: rgba(0,0,0,.45); }
  </style>
</head>
<body>

      <button class="tab-btn active" data-module="m1">Module 1 - Articles 1 à 27</button>

  </header>

    </section>

function summarize(text) {
  return text.split(/\s+/).slice(0, 30).join(" ") + (text.split(/\s+/).length > 30 ? "…" : "");
}

function parseReg(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const out = [];
  let current = null;
  for (const line of lines) {
    const articleHead = line.match(/^ARTICLE\s+(\d+)\s+[–-]\s+(.+)$/i);
    const clause = line.match(/^((?:\d+(?:\.\d+){0,2})|[a-i]\))\s+(.+)$/i);
    if (articleHead) {
      if (current) out.push(current);
      current = { article: articleHead[1], articleAlineas: `ARTICLE ${articleHead[1]} - ${articleHead[2]}`, full: "" };
    } else if (clause) {
      if (current) out.push(current);
      current = { article: clause[1], articleAlineas: `${clause[1]} ${clause[2]}`, full: "" };
    } else if (current) {
      current.full += (current.full ? " " : "") + line;
    }
  }
  if (current) out.push(current);
  return out.map(e => ({...e, summary: summarize(e.full || e.articleAlineas)}));
}

function renderTable(id, rows) {
  const table = document.getElementById(id);
  table.innerHTML = `<thead><tr><th>Article</th><th>Article et alinéas</th><th>Texte complet</th><th>Résumé IA (max 30 mots)</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${r.article}</td><td>${r.articleAlineas}</td><td>${r.full}</td><td>${r.summary}</td></tr>`).join("")}</tbody>`;
}

  ];
  const conformes = [
    ["AUCUNE", "Maison: avertisseurs fonctionnels à chaque étage, extincteur ABC 5 lb, issues dégagées.", "Valoriser les bonnes pratiques, encourager maintien des vérifications périodiques."],
    ["AUCUNE", "Borne privée bien identifiée, dégagée, inspection démontrée.", "Reconnaître l’effort, conserver un ton positif et renforcer les acquis."],
    ["AUCUNE", "Système d’alarme inscrit avec 3 contacts à jour.", "Souligner la conformité administrative et l’importance d’actualiser les contacts."],
    ["AUCUNE", "Cheminée ramonée récemment avec preuve de service.", "Féliciter la prévention proactive et rappeler le suivi annuel."],
    ["AUCUNE", "Local de réunion: sorties signalées et éclairage de sécurité fonctionnel.", "Adopter ton encourageant, confirmer les points forts de sécurité."],
    ["AUCUNE", "Réservoir propane protégé contre collisions et zone déneigée.", "Remercier la collaboration, maintenir vigilance saisonnière."],
    ["AUCUNE", "Foyer extérieur à plus de 3 m avec pare-étincelles.", "Consolider les bons réflexes avec une approche citoyenne valorisante."],
    ["AUCUNE", "Terrain vacant sans accumulation de matières combustibles.", "Mettre en valeur l’entretien préventif et le risque réduit."],
    ["AUCUNE", "Bâtiment industriel avec entrée électrique dégagée de 1 m.", "Reconnaître la conformité et recommander inspections internes régulières."],
    ["AUCUNE", "Chambre en location avec fenêtre d’évacuation conforme.", "Valider le respect de l’issue et encourager affichage des consignes."],
  ];
  const distract = ["3.1","4.1","8.1","12.2","14.2","16.1","19.3","21.1","22.1","26.1"];
  const mix = [...anomalies, ...conformes];
  const scenarios = [];
  for (let i=0;i<50;i++) {
    const seed = mix[i % mix.length];
    const good = seed[0];
    const optionsBase = good === "AUCUNE"
      ? ["AUCUNE"]
      : [good];
    while (optionsBase.length < 5) {
      const cand = distract[Math.floor(Math.random()*distract.length)];
      if (!optionsBase.includes(cand)) optionsBase.push(cand);
    }
    if (good === "AUCUNE") {
      while (optionsBase.length < 5) {
        const cand = distract[Math.floor(Math.random()*distract.length)];
        if (!optionsBase.includes(cand)) optionsBase.push(cand);
      }
    }
    scenarios.push({
      id: i+1,
      text: `${seed[1]} (Scénario ${i+1})`,
      good,
      choices: optionsBase.sort(() => Math.random() - 0.5),
      approach: seed[2],
      explain: good === "AUCUNE" ? "Aucune anomalie constatée; conserver les bonnes pratiques et la vigilance." : `${good}: application directe de l’exigence au contexte observé.`
    });
  }
  return scenarios.sort(() => Math.random() - 0.5);
}

let data = {
  module1: parseReg(rawModule1),
  module2: parseReg(rawModule2),
  scenarios: baseScenarios()
};

const fromStorage = localStorage.getItem("reg672_data");
if (fromStorage) {
  try { data = JSON.parse(fromStorage); } catch {}
}

renderTable("tableM1", data.module1);
renderTable("tableM2", data.module2);

const tabs = document.querySelectorAll(".tab-btn");
const modules = document.querySelectorAll(".module");
tabs.forEach(btn => btn.onclick = () => {
  tabs.forEach(b => b.classList.remove("active"));
  modules.forEach(m => m.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(btn.dataset.module).classList.add("active");
});

document.getElementById("toggleTheme").onclick = () => document.body.classList.toggle("dark");

function searchTable(inputId, sourceKey, tableId){
  document.getElementById(inputId).addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    const filtered = data[sourceKey].filter(r => Object.values(r).join(" ").toLowerCase().includes(q));
    renderTable(tableId, filtered);
  });
}
searchTable("searchM1","module1","tableM1");
searchTable("searchM2","module2","tableM2");

[5,10,15,20,25,30,35,40,45,50].forEach(n => {
  const o = document.createElement("option"); o.value=n; o.textContent=`${n} scénarios`; scenarioCount.appendChild(o);
});

let state = { started:false, idx:0, total:0, good:0, bad:0, selected:null, run:[] };
const scenarioArea = document.getElementById("scenarioArea");
const confirmDialog = document.getElementById("confirmDialog");

function updateScore(){
  scoreIndex.textContent = state.idx;
  scoreTotal.textContent = state.total;
  good.textContent = state.good;
  bad.textContent = state.bad;
  const note = state.total ? Math.round((state.good / state.total) * 100) : 0;
  document.getElementById("note").textContent = note;
  if (note >= 95) revision.textContent = "Excellent (≥95%). Maintenir ce niveau avec révision périodique des articles critiques.";
  else {
    const weaknesses = state.run.slice(0,state.idx).filter(x=>!x.ok).map(x=>x.good).filter(x=>x!=="AUCUNE");
    const target = weaknesses[weaknesses.length-1] || "3.1";
    revision.textContent = `Objectif 95%: ${revisionMap[target] || "Réviser les articles associés aux erreurs récentes."}`;
  }
}

function showQuestion(){
  if (state.idx >= state.total) {
    const note = Math.round((state.good / state.total) * 100);
    scenarioArea.innerHTML = `<h3>Simulation terminée</h3><p>Note finale: <strong>${note}/100</strong>.</p><p>${note>=95?"Très bon niveau.":"Réviser les articles des erreurs et relancer une simulation."}</p>`;
    updateScore();
    return;
  }
  const s = state.run[state.idx];
  scenarioArea.innerHTML = `<h3>Scénario ${state.idx+1}</h3><p>${s.text}</p><div class="small"><strong>Approche citoyenne recommandée:</strong> ${s.approach}</div><div class="choices">${s.choices.map((c,i)=>`<button class='choice-btn' data-c='${c}'>Choix ${i+1}: ${c}</button>`).join('')}</div><div id='fb' class='feedback'></div>`;
  scenarioArea.querySelectorAll(".choice-btn").forEach(b => b.onclick = () => {
    state.selected = b.dataset.c;
    confirmText.textContent = `Confirmez votre réponse: ${state.selected}`;
    confirmDialog.showModal();
  });
}

startSim.onclick = () => {
  const name = participantName.value.trim();
  if (!name) return alert("Veuillez entrer le nom du participant.");
  state = { started:true, idx:0, total:Number(scenarioCount.value||5), good:0, bad:0, selected:null, run:[...data.scenarios].sort(()=>Math.random()-0.5).slice(0, Number(scenarioCount.value||5)).map(s=>({...s, choices:[...s.choices].sort(()=>Math.random()-0.5)} )};
  scoreName.textContent = name;
  updateScore();
  showQuestion();
};

confirmAccept.onclick = () => {
  const s = state.run[state.idx];
  const ok = state.selected === s.good;
  if (ok) state.good++; else state.bad++;
  state.run[state.idx].ok = ok;
  const fb = document.getElementById("fb");
  if (fb) fb.innerHTML = ok
    ? `<p class='feedback ok'>✅ Bonne réponse.</p>`
    : `<p class='feedback bad'>❌ Mauvaise réponse. Bon article: <strong>${s.good}</strong>. ${summarize(s.explain)}</p>`;
  confirmDialog.close();
  setTimeout(()=>{ state.idx++; updateScore(); showQuestion(); }, 850);
};
confirmModify.onclick = () => confirmDialog.close();

resetSim.onclick = () => {
  state = { started:false, idx:0, total:0, good:0, bad:0, selected:null, run:[] };
  scoreName.textContent = "-";
  participantName.value = "";
  scenarioArea.innerHTML = "<p>Participation effacée.</p>";
  updateScore();
};

function refreshAdmin() {
  adminRegs.value = JSON.stringify({module1:data.module1,module2:data.module2}, null, 2);
  adminScenarios.value = JSON.stringify(data.scenarios, null, 2);
}
refreshAdmin();

saveAdmin.onclick = () => {
  try {
    const regs = JSON.parse(adminRegs.value);
    const sc = JSON.parse(adminScenarios.value);
    data.module1 = regs.module1;
    data.module2 = regs.module2;
    data.scenarios = sc;
    localStorage.setItem("reg672_data", JSON.stringify(data));
    renderTable("tableM1", data.module1);
    renderTable("tableM2", data.module2);
    alert("Données sauvegardées.");
  } catch (e) { alert("JSON invalide: " + e.message); }
};

downloadAdmin.onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "reglement-672-2017-data.json";
  a.click();
};

resetAdmin.onclick = () => {
  localStorage.removeItem("reg672_data");
  data = {module1:parseReg(rawModule1), module2:parseReg(rawModule2), scenarios:baseScenarios()};
  renderTable("tableM1", data.module1);
  renderTable("tableM2", data.module2);
  refreshAdmin();
  alert("Données restaurées.");
};

uploadAdmin.onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      data = JSON.parse(r.result);
      localStorage.setItem("reg672_data", JSON.stringify(data));
      renderTable("tableM1", data.module1);
      renderTable("tableM2", data.module2);
      refreshAdmin();
      alert("Import réussi.");
    } catch { alert("Fichier invalide."); }
  };
  r.readAsText(f);
};
</script>
